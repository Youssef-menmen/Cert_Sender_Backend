# =====================================================
# CONFIGURATION LOCALE (développement sur votre PC)
# Ce fichier est utilisé quand vous faites : mvn spring-boot:run
# =====================================================

server.port=8080

# --- MySQL LOCAL (votre MySQL installé sur votre PC) ---
spring.datasource.url=jdbc:mysql://localhost:3306/cert_sender?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# --- Email Gmail (mettez vos vraies valeurs ici pour tester en local) ---
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=votre-email@gmail.com
spring.mail.password=xxxx-xxxx-xxxx-xxxx
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=3000
spring.mail.properties.mail.smtp.writetimeout=5000

# --- Upload ---
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=100MB

# --- CORS local : autorise React sur localhost:3000 ---
app.cors.allowed-origins=http://localhost:3000

# --- App ---
app.mail.from-name=Administration
app.mail.delay-between-emails=500
