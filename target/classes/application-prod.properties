# =====================================================
# CONFIGURATION PRODUCTION (hébergement sur Render)
# Ce fichier est utilisé quand Render démarre l'app avec :
# --spring.profiles.active=prod
#
# Toutes les valeurs ${...} sont des variables d'environnement
# que vous configurez dans le dashboard Render.
# Vous ne mettez JAMAIS vos vrais identifiants ici.
# =====================================================

server.port=${PORT:8080}

# --- MySQL Aiven (cloud) ---
# Les variables DB_HOST, DB_PORT, etc. sont définies dans Render
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslMode=REQUIRED&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# --- Email Gmail ---
spring.mail.host=smtp.gmail.com
spring.mail.port=465
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=3000
spring.mail.properties.mail.smtp.writetimeout=5000

# --- Upload ---
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=100MB

# --- CORS production : autorise votre site Netlify ---
app.cors.allowed-origins=${FRONTEND_URL}

# --- App ---
app.mail.from-name=${MAIL_FROM_NAME:Administration}
app.mail.delay-between-emails=500
